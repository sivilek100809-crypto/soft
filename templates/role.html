<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добро пожаловать в BeautyStart</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-pink-50 text-gray-800 flex items-center justify-center min-h-screen p-4">

    <div class="max-w-md w-full text-center">
        <h1 class="text-4xl font-extrabold text-gray-900 mb-2 flex items-center justify-center gap-2">
            ✨ BeautyStart
        </h1>
        <p class="text-sm text-gray-500 mb-8">Платформа поиска мастеров и записи на бьюти-процедуры</p>

        <div class="space-y-4">
            <a href="/client" class="block bg-white border border-pink-200 p-6 rounded-2xl shadow-sm hover:shadow-md hover:border-pink-400 transition text-left group">
                <div class="flex items-center justify-between">
                    <div>
                        <h2 class="text-lg font-bold text-gray-800 group-hover:text-pink-600 transition">🙋‍♀️ Я клиент</h2>
                        <p class="text-xs text-gray-400 mt-1">Хочу найти салон, выбрать мастера и записаться на услугу</p>
                    </div>
                    <span class="text-xl text-pink-500 group-hover:translate-x-1 transition">→</span>
                </div>
            </a>

            <a href="/master/list" class="block bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-sm hover:shadow-md transition text-left group text-white">
                <div class="flex items-center justify-between">
                    <div>
                        <h2 class="text-lg font-bold text-pink-400">👑 Я мастер</h2>
                        <p class="text-xs text-slate-400 mt-1">Хочу войти в личный кабинет, настроить прайс и расписание</p>
                    </div>
                    <span class="text-xl text-pink-400 group-hover:translate-x-1 transition">→</span>
                </div>
            </a>
        </div>
    </div>

</body>
</html>
