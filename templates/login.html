<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход для мастеров</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-lux-dark text-slate-100 flex items-center justify-center min-h-screen p-4">

    <div class="max-w-sm w-full glass-dark p-7 rounded-3xl">
        <div class="text-center mb-6">
            <div class="ring-lux w-20 h-20 mx-auto">
                <img src="{{ master.avatar }}" class="w-full h-full object-cover">
            </div>
            <h1 class="font-display text-2xl font-bold mt-3 text-white">Личный кабинет</h1>
            <p class="text-xs text-violet-200/60 mt-1">{{ master.name }}</p>
        </div>

        {% if error %}
        <div class="bg-rose-500/15 text-rose-300 text-xs p-3 rounded-xl border border-rose-500/30 mb-4 text-center font-medium">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-violet-200/60 mb-2">Введите ваш пароль</label>
                <input type="password" name="password" placeholder="••••••••" required autofocus
                       class="input-dark w-full p-3 text-center text-lg tracking-widest">
            </div>

            <button type="submit" class="btn-lux w-full font-bold py-3 rounded-2xl text-sm">
                Войти в панель управления
            </button>
        </form>

        <a href="/master/{{ master.id }}" class="block text-center text-xs text-violet-200/40 mt-4 hover:text-violet-200/70">← Вернуться на сайт</a>
    </div>

</body>
</html>
